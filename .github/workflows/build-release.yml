name: Build and publish Windows GUI installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install ps2exe
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name ps2exe -Scope CurrentUser -Force

      - name: Build GUI executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Invoke-PS2EXE -inputFile "scripts/Installer-GUI.ps1" -outputFile "dist/DoomsdayUSB-Installer.exe" -title "Doomsday USB Installer" -description "USB installer with normal and custom wiki modes" -company "doomsday-usb" -product "Doomsday USB" -version "0.2.0" -noConsole

      - name: Package release
        shell: pwsh
        run: |
          Copy-Item README.md, TESTING.md, CHANGELOG.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath "DoomsdayUSB-Alpha.zip" -Force

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          name: "Doomsday USB Alpha ${{ github.ref_name }}"
          body: |
            **Experimental alpha GUI installer. Test with spare USB drives first.**

            Normal install copies all source files. Custom install copies the non-wiki system files and only the selected .zim archives.
            This is a file-level copy, not a sector clone. It does not format or erase the destination.
          files: |
            dist/DoomsdayUSB-Installer.exe
            DoomsdayUSB-Alpha.zip
          draft: false
          prerelease: true
